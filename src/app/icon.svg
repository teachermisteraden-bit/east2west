<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The favicon is not the badge shrunk down. At 16px the laurel, the figures and
    the standard all collapse into a single grey smudge, so this keeps only the
    two marks that survive: the eight-point star of the standard, over the open
    book. Same palette, same geometry, legible at a tab's worth of pixels.
  -->
  <rect width="64" height="64" rx="14" fill="#1F5A45"/>
  <g fill="#D9B878">
    <rect x="25" y="13" width="14" height="14"/>
    <rect x="25" y="13" width="14" height="14" transform="rotate(45 32 20)"/>
  </g>
  <g fill="#F5F1E8">
    <path d="M32 40c-5-3.6-11.4-4.8-17.2-4.2-.5 0-.8.4-.8.9v10.6c0 .5.4.9.9.9 5.7-.6 12 .6 17.1 4.2z"/>
    <path d="M32 40c5-3.6 11.4-4.8 17.2-4.2.5 0 .8.4.8.9v10.6c0 .5-.4.9-.9.9-5.7-.6-12 .6-17.1 4.2z"/>
  </g>
  <path d="M32 40v12.4" stroke="#1F5A45" stroke-width="2.2" stroke-linecap="round"/>
</svg>
