<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The eight-fold lattice motif the dawn light passes through — the site's own
    geometry, rather than the retired arch. A pattern, never a building.
    Replaced by the mark in brand/ when Claude Design delivers it.
  -->
  <rect width="64" height="64" fill="#101315"/>
  <g fill="none" stroke="#D9B878" stroke-width="2" stroke-linejoin="round">
    <rect x="18" y="18" width="28" height="28"/>
    <rect x="18" y="18" width="28" height="28" transform="rotate(45 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="5" fill="#D9B878"/>
</svg>
